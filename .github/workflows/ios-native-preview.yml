name: Native iOS preview (unsigned only)

on:
  push:
    branches: [codex/teletyptel-beta-polish]
    paths:
      - .github/workflows/ios-native-preview.yml
      - mobile/ios-native/**
      - '!mobile/ios-native/README.md'
      - scripts/prepare-ios-native.js
      - scripts/check-ios-native.js
      - tests/ios-native-foundation.test.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort -r | head -n 1)
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check isolated project generator
        run: node --test tests/ios-native-foundation.test.js
      - name: Compile native app and test iPhone and iPad
        run: node scripts/check-ios-native.js
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-native-preview-${{ github.run_id }}
          path: artifacts/ios-native-check-*/reports/
          retention-days: 3
