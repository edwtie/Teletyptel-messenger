name: Native iOS validation and internal TestFlight

on:
  push:
    branches: [codex/teletyptel-beta-polish]
    paths:
      - .github/workflows/ios-native-preview.yml
      - mobile/ios-native/**
      - '!mobile/ios-native/README.md'
      - scripts/prepare-ios-native.js
      - scripts/native-login-assets.js
      - scripts/native-web-palette.js
      - scripts/native-smiley-assets.js
      - tests/native-smileys.test.js
      - php/public/smileys/**
      - tests/native-web-palette.test.js
      - php/public/chat-client.css
      - php/public/call-controls-menu.css
      - tests/native-login-presentation.test.js
      - tests/native-chat-menu-layout.test.js
      - scripts/check-ios-native.js
      - scripts/check-ios-native-media.js
      - scripts/check-ios-native-codecs.js
      - scripts/check-ios-native-update.js
      - scripts/check-ios-native-archive.js
      - scripts/native-archive-config.js
      - scripts/native-internal-release.js
      - scripts/native-runtime-linkage.js
      - scripts/native-release-startup.js
      - scripts/native-simulator-session.js
      - tests/native-simulator-session.test.js
      - tests/native-runtime-linkage.test.js
      - scripts/native-provider-config.js
      - tests/native-internal-release.test.js
      - scripts/check-ios-native-ui.js
      - scripts/ios-testflight/native-localization.js
      - tests/native-feature-completion.test.js
      - tests/native-g722.test.js
      - tests/ios-native-foundation.test.js
      - tests/native-cloud-history.test.js
      - php/lib/NativeCloudHistory.php
      - php/public/api/native-history.php
      - php/public/api/history.php
      - php/tests/native-cloud-history-test.php
      - php/tests/native-cloud-history-http-test.php
  workflow_dispatch:
    inputs:
      internal_upload:
        description: Explicit signed internal TestFlight upload after unsigned archive checks (no public release)
        type: boolean
        default: false
      build_number:
        description: Unique Apple build number required for an internal upload
        type: string
        required: false
      native_push_test:
        description: Explicit unsigned production-APNs native staging (focused-update or focused-archive; no upload)
        type: boolean
        default: false
      validation_mode:
        description: Full matrix or explicitly scoped logic, media or UI regression
        type: choice
        options: [full, focused-update, focused-media, focused-ui, focused-archive]
        default: full
      ui_scope:
        description: Explicit test selection for focused-ui only
        type: choice
        options: [regression, groups, tc, menus, startup, appearance, smileys, visual, visual-metrics, visual-repair, visual-startup, message-actions]
        default: regression

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: ${{ (inputs.validation_mode == 'focused-archive' || (inputs.validation_mode == 'focused-ui' && (inputs.ui_scope == 'menus' || inputs.ui_scope == 'startup' || inputs.ui_scope == 'appearance' || inputs.ui_scope == 'smileys' || inputs.ui_scope == 'visual' || inputs.ui_scope == 'visual-metrics' || inputs.ui_scope == 'visual-repair' || inputs.ui_scope == 'visual-startup' || inputs.ui_scope == 'message-actions'))) && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    env:
      TELETYPTEL_NATIVE_TEST_FAMILY: ${{ matrix.family }}
      TELETYPTEL_NATIVE_PUSH_TEST: ${{ inputs.native_push_test && '1' || '0' }}
      TELETYPTEL_NATIVE_VALIDATION_MODE: ${{ inputs.validation_mode || 'full' }}
      TELETYPTEL_NATIVE_UI_SCOPE: ${{ inputs.ui_scope || 'regression' }}
      TELETYPTEL_NATIVE_BUILD_NUMBER: ${{ inputs.build_number || '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort -r | head -n 1)
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Validate explicit internal release request
        if: inputs.internal_upload == true
        run: |
          test "$TELETYPTEL_NATIVE_VALIDATION_MODE" = focused-archive
          test "$TELETYPTEL_NATIVE_PUSH_TEST" = 1
          node -e 'require("./scripts/native-archive-config").validate({version:"1.0",buildNumber:process.env.TELETYPTEL_NATIVE_BUILD_NUMBER},{bundleId:"com.tiedragon.teletyptel",environment:"production",testOnly:true})'
      - name: Check explicitly requested native push staging
        if: inputs.native_push_test == true
        run: |
          case "$TELETYPTEL_NATIVE_VALIDATION_MODE" in focused-update|focused-archive) ;; *) exit 1 ;; esac
          node --test --test-name-pattern='Native push|Production APNs|APNs production' tests/native-push-activation.test.js
      - name: Check isolated native archive packaging
        if: inputs.validation_mode == 'focused-archive'
        run: |
          test "$TELETYPTEL_NATIVE_PUSH_TEST" = 1
          node --test tests/native-archive.test.js tests/native-internal-release.test.js tests/native-runtime-linkage.test.js
      - name: Check isolated project generator
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode == 'full'
        run: node --test tests/ios-native-foundation.test.js
      - name: Check shared online history API
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode == 'full'
        run: node --test tests/native-cloud-history.test.js
      - name: Check focused update guard
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode != 'full'
        run: node --test tests/ios-native-update.test.js tests/native-g722.test.js
      - name: Check native recovery, capture, privacy and localization contracts
        run: node --test tests/native-feature-completion.test.js tests/native-login-presentation.test.js tests/native-chat-menu-layout.test.js tests/native-simulator-session.test.js tests/native-web-palette.test.js tests/native-smileys.test.js
      - name: Compile native app and test ${{ matrix.family }}
        run: |
          if [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-archive" ]; then
            node scripts/check-ios-native-archive.js
          elif [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-media" ]; then
            node scripts/check-ios-native-codecs.js
          elif [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-update" ]; then
            node scripts/check-ios-native-update.js
          elif [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-ui" ]; then
            node scripts/check-ios-native-ui.js
          else
            node scripts/check-ios-native.js
          fi
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-native-preview-${{ github.run_id }}-${{ matrix.family }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/ios-native-check-*/reports/
            artifacts/ios-native-update-*/reports/
            artifacts/ios-native-archive-*/reports/
          retention-days: 3

  internal-native-upload:
    needs: native-preview
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/teletyptel-beta-polish' && inputs.internal_upload == true && inputs.native_push_test == true && inputs.validation_mode == 'focused-archive'
    environment: ios-testflight
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort -r | head -n 1)
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check native release contracts without credentials
        run: node --test tests/native-internal-release.test.js tests/native-runtime-linkage.test.js
      - name: Sign and upload native internal candidate
        env:
          TELETYPTEL_NATIVE_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_NATIVE_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_NATIVE_PROVISION_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ASC_KEY_P8: ${{ secrets.IOS_ASC_KEY_P8 }}
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_FACEBOOK_APP_ID: ${{ secrets.IOS_FACEBOOK_APP_ID }}
          IOS_FACEBOOK_CLIENT_TOKEN: ${{ secrets.IOS_FACEBOOK_CLIENT_TOKEN }}
        run: node scripts/native-internal-release.js --upload-internal
      - name: Save non-secret native upload status
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-internal-upload-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/ios-native-internal-*/reports/result.json
          retention-days: 7
