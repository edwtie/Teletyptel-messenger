name: Native iOS preview (unsigned only)

on:
  push:
    branches: [codex/teletyptel-beta-polish]
    paths:
      - .github/workflows/ios-native-preview.yml
      - mobile/ios-native/**
      - '!mobile/ios-native/README.md'
      - scripts/prepare-ios-native.js
      - scripts/check-ios-native.js
      - scripts/check-ios-native-media.js
      - scripts/check-ios-native-codecs.js
      - scripts/check-ios-native-update.js
      - scripts/check-ios-native-ui.js
      - scripts/ios-testflight/native-localization.js
      - tests/native-feature-completion.test.js
      - tests/native-g722.test.js
      - tests/ios-native-foundation.test.js
      - tests/native-cloud-history.test.js
      - php/lib/NativeCloudHistory.php
      - php/public/api/native-history.php
      - php/public/api/history.php
      - php/tests/native-cloud-history-test.php
      - php/tests/native-cloud-history-http-test.php
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Full matrix or explicitly scoped logic, media or UI regression
        type: choice
        options: [full, focused-update, focused-media, focused-ui]
        default: full
      ui_scope:
        description: Explicit test selection for focused-ui only
        type: choice
        options: [regression, groups]
        default: regression

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    env:
      TELETYPTEL_NATIVE_TEST_FAMILY: ${{ matrix.family }}
      TELETYPTEL_NATIVE_VALIDATION_MODE: ${{ inputs.validation_mode || 'full' }}
      TELETYPTEL_NATIVE_UI_SCOPE: ${{ inputs.ui_scope || 'regression' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort -r | head -n 1)
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check isolated project generator
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode == 'full'
        run: node --test tests/ios-native-foundation.test.js
      - name: Check shared online history API
        if: github.event_name != 'workflow_dispatch' || inputs.validation_mode == 'full'
        run: node --test tests/native-cloud-history.test.js
      - name: Check focused update guard
        if: github.event_name == 'workflow_dispatch' && inputs.validation_mode != 'full'
        run: node --test tests/ios-native-update.test.js tests/native-g722.test.js
      - name: Check native recovery, capture, privacy and localization contracts
        run: node --test tests/native-feature-completion.test.js
      - name: Compile native app and test ${{ matrix.family }}
        run: |
          if [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-media" ]; then
            node scripts/check-ios-native-codecs.js
          elif [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-update" ]; then
            node scripts/check-ios-native-update.js
          elif [ "$TELETYPTEL_NATIVE_VALIDATION_MODE" = "focused-ui" ]; then
            node scripts/check-ios-native-ui.js
          else
            node scripts/check-ios-native.js
          fi
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-native-preview-${{ github.run_id }}-${{ matrix.family }}
          path: |
            artifacts/ios-native-check-*/reports/
            artifacts/ios-native-update-*/reports/
          retention-days: 3
