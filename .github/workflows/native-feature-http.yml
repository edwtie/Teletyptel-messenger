name: Native profile and upload HTTP integration (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: native_feature_test
          MYSQL_USER: fixture
          MYSQL_PASSWORD: fictional-fixture-only
          MYSQL_ROOT_PASSWORD: fictional-root-only
        ports:
          - 127.0.0.1:3307:3306
        options: --health-cmd="mysqladmin ping -h localhost -pfictional-root-only" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TELETYPTEL_DB_HOST: 127.0.0.1
      TELETYPTEL_DB_PORT: 3307
      TELETYPTEL_DB_NAME: native_feature_test
      TELETYPTEL_DB_USER: fixture
      TELETYPTEL_DB_PASSWORD: fictional-fixture-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install test-only PHP extensions
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-mysql php-sqlite3 php-zip
      - name: Verify profile and upload policies
        run: |
          php php/tests/native-profile-test.php
          php php/tests/native-upload-policy-test.php
      - name: Exercise actual PHP endpoints and MySQL with fictional sessions
        run: node scripts/check-native-feature-http.js
      - name: Retain sanitized result only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-feature-http-${{ github.run_id }}
          path: artifacts/native-feature-http-*/result.json
          retention-days: 3
