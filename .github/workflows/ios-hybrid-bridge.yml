name: Hybrid iOS bridge unsigned validation

on:
  push:
    branches: [codex/ios-hybrid-webui]
    paths:
      - .github/workflows/ios-hybrid-bridge.yml
      - mobile/ios-hybrid/**
      - scripts/ios-hybrid/**
      - tests/ios-hybrid-*.test.js
      - scripts/prepare-ios-native.js
      - mobile/ios-native/App/NativeCallController.swift
      - mobile/ios-native/App/NativeCallPlatform.swift
      - mobile/ios-native/App/NativeAttachmentsView.swift
      - mobile/ios-native/Sources/TeleTypTelCore/NativeGroupManagement.swift
      - mobile/ios-native/Tests/TeleTypTelCoreTests/NativeGroupManagementTests.swift
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Select installed Xcode 26
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort -r | head -n 1)
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
      - name: Validate pinned UI and JavaScript boundary
        run: node --test tests/ios-hybrid-baseline.test.js tests/ios-hybrid-session.test.js tests/ios-hybrid-contacts.test.js tests/ios-hybrid-messenger.test.js tests/ios-hybrid-features.test.js tests/ios-hybrid-accounts.test.js tests/ios-hybrid-history-smileys.test.js
      - name: Prepare pinned login content without legacy engines
        run: |
          export TELETYPTEL_HYBRID_CONTENT="$RUNNER_TEMP/teletyptel-hybrid-content.json"
          node scripts/ios-hybrid/build-content.js
          echo "TELETYPTEL_HYBRID_CONTENT=$TELETYPTEL_HYBRID_CONTENT" >> "$GITHUB_ENV"
      - name: Install isolated browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium webkit
      - name: Test login layout and rotation in Chromium and WebKit
        run: node --test tests/ios-hybrid-presentation.test.js
      - name: Test native session bridge with fictional accounts
        if: ${{ !cancelled() }}
        run: swift test --package-path mobile/ios-hybrid --scratch-path "$RUNNER_TEMP/teletyptel-hybrid-macos"
      - name: Compile unsigned iOS simulator library
        if: ${{ !cancelled() }}
        run: |
          swift build --package-path mobile/ios-hybrid \
            --scratch-path "$RUNNER_TEMP/teletyptel-hybrid-ios" \
            --triple arm64-apple-ios16.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
      - name: Test existing native group upload and translation privacy rules with fixtures
        if: ${{ !cancelled() }}
        run: |
          swift test --package-path mobile/ios-native --scratch-path "$RUNNER_TEMP/teletyptel-native-feature-tests" \
            --filter 'NativeMUCTests|NativeTwoFactorHTTPTests|NativeGroupModelTests|NativeGroupManagementTests|NativeAccountFeaturesTests|NativeServicesTests|NativeSavedLoginTests|NativeContactTests|NativeFeatureCompletionTests|NativeCloudMergeTests|NativeCloudSyncTests|NativeCloudHistoryTests|NativePresentationTests|NativeInterpreterTests'
      - name: Assemble the isolated hybrid app with the existing native engine
        if: ${{ !cancelled() }}
        run: node scripts/ios-hybrid/prepare-app.js
      - name: Compile the complete app without signing or push activation
        id: app-build
        if: ${{ !cancelled() }}
        run: |
          xcodebuild -project artifacts/ios-native-hybrid-validation/TeleTypTelNative.xcodeproj \
            -scheme TeleTypTelNative -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/teletyptel-hybrid-app" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Smoke-test the assembled app on iPhone and iPad simulators
        if: ${{ !cancelled() && steps.app-build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json, platform, subprocess
          architecture = platform.machine()
          if architecture not in ['arm64', 'x86_64']:
              raise RuntimeError('Unsupported runner architecture')
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          available = [(runtime, device) for runtime, values in devices.items() if '.iOS-' in runtime for device in values if device.get('isAvailable')]
          for kind in ['iPhone', 'iPad']:
              candidates = [(runtime, device) for runtime, device in available if device['name'].startswith(kind)]
              if not candidates:
                  raise RuntimeError('Missing simulator: ' + kind)
              runtime, device = sorted(candidates, key=lambda item: (item[0], item[1]['name']), reverse=True)[0]
              subprocess.run(['xcodebuild', 'test', '-project', 'artifacts/ios-native-hybrid-validation/TeleTypTelNative.xcodeproj',
                  '-scheme', 'TeleTypTelNative', '-configuration', 'Debug', '-destination', 'platform=iOS Simulator,arch=' + architecture + ',id=' + device['udid'],
                  '-derivedDataPath', __import__('os').environ['RUNNER_TEMP'] + '/teletyptel-hybrid-app',
                  '-only-testing:NativeStartupUITests/HybridStartupUITests', '-parallel-testing-enabled', 'NO',
                  'ARCHS=' + architecture, 'ONLY_ACTIVE_ARCH=YES', 'CODE_SIGNING_ALLOWED=NO'], check=True)
          PY
